<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corvallis Resource Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
#map { height: 80vh; }
  .leaflet-popup-content { text-transform: capitalize; }
</style>
</head>
<body>
<h1>Corvallis Resource Finder</h1>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
var map = L.map("map").setView([44.5646, -123.262], 13);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

Papa.parse("data.csv", {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function (results) {
    results.data.forEach(function (row) {
      L.marker([row.lat, row.lon]).addTo(map).bindPopup(row.name || row.category);
    });
  }
});
</script>
</body>
</html>
